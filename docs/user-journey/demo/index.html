<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MyCCS — Student &amp; Org Officer Journey Prototype</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body data-variation="ccs-crest">
  <!-- Compact Mobile Switcher (visible <= 768px) -->
  <header class="mobile-bar" aria-label="Demo screen switcher">
    <button type="button" class="mobile-bar-role" id="mobileRoleBtn" title="Switch persona">Student</button>
    <button type="button" class="mobile-bar-var" id="mobileVarBtn" title="Cycle visual variation">CCS Crest</button>
    <select id="mobileScreenSelect" aria-label="Select screen"></select>
  </header>

  <main class="studio-shell">
    <!-- Left Journey Rail -->
    <aside class="studio-rail" aria-label="User journey navigation">
      <div class="studio-brand">
        <div class="ccs-mark" aria-hidden="true">CCS</div>
        <div>
          <div class="studio-brand-title">MyCCS Prototype</div>
          <div class="studio-brand-sub">College of IT &amp; Computer Science · IT · CS · LIS</div>
        </div>
      </div>

      <div>
        <div class="rail-section-label">Design variation</div>
        <div class="variation-grid" role="group" aria-label="Select visual variation">
          <button type="button" class="var-btn var-btn--wide" data-variation-pick="ccs-crest" aria-pressed="true">
            <span class="var-swatches" aria-hidden="true">
              <span style="background:#0B2E59"></span>
              <span style="background:#0052CC"></span>
              <span style="background:#0EA5E9"></span>
              <span style="background:#D4A500"></span>
            </span>
            <span>CCS Crest (Logo Palette)</span>
          </button>
          <button type="button" class="var-btn" data-variation-pick="editorial" aria-pressed="false">
            <span class="var-swatches" aria-hidden="true">
              <span style="background:#1668FF"></span>
              <span style="background:#9327FF"></span>
              <span style="background:#E125B5"></span>
              <span style="background:#111113"></span>
            </span>
            <span>Editorial Deck</span>
          </button>
          <button type="button" class="var-btn" data-variation-pick="cobalt" aria-pressed="false">
            <span class="var-swatches" aria-hidden="true">
              <span style="background:#1F4FD8"></span>
              <span style="background:#0F172A"></span>
              <span style="background:#067647"></span>
              <span style="background:#F8FAFC"></span>
            </span>
            <span>Cobalt PDF</span>
          </button>
          <button type="button" class="var-btn" data-variation-pick="passbook" aria-pressed="false">
            <span class="var-swatches" aria-hidden="true">
              <span style="background:#8C1D2C"></span>
              <span style="background:#F7F5F0"></span>
              <span style="background:#0F766E"></span>
              <span style="background:#181C23"></span>
            </span>
            <span>Passbook</span>
          </button>
          <button type="button" class="var-btn" data-variation-pick="concourse" aria-pressed="false">
            <span class="var-swatches" aria-hidden="true">
              <span style="background:#111827"></span>
              <span style="background:#D9480F"></span>
              <span style="background:#1D4ED8"></span>
              <span style="background:#F2F4F7"></span>
            </span>
            <span>Concourse</span>
          </button>
        </div>
      </div>

      <div class="persona-switcher" role="group" aria-label="Select persona">
        <button type="button" class="persona-btn" id="tabStudent" aria-pressed="true">Student (9)</button>
        <button type="button" class="persona-btn" id="tabOfficer" aria-pressed="false">Org Officer (5)</button>
      </div>

      <nav aria-label="Journey screens">
        <ul class="journey-list" id="journeyList"></ul>
      </nav>

      <div class="rail-stepper">
        <button type="button" class="stepper-btn" id="prevBtn">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
          Previous
        </button>
        <button type="button" class="stepper-btn" id="nextBtn">
          Next
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
        </button>
      </div>
    </aside>

    <!-- Center Mobile Device Viewport (390x844) -->
    <section class="phone-stage" aria-label="Interactive mobile screen preview">
      <div class="phone-frame" id="phoneFrame">
        <div class="phone-statusbar" aria-hidden="true">
          <span class="tabular">9:41</span>
          <div class="statusbar-icons">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg>
            <svg width="18" height="14" viewBox="0 0 24 14" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="2" width="18" height="10" rx="2"/><rect x="3.5" y="4.5" width="12" height="5" rx="1" fill="currentColor" stroke="none"/><path d="M22 5v4" stroke-linecap="round"/></svg>
          </div>
        </div>
        <div class="phone-screen" id="phoneScreen"></div>
        <div class="toast-host" id="phoneToast" aria-live="polite"></div>
      </div>
    </section>

    <!-- Right Context Strip -->
    <aside class="studio-context" aria-label="Screen specification">
      <span class="context-fr mono" id="ctxFr">FR-AUTH-01</span>
      <h2 class="context-heading" id="ctxTitle">Sign up</h2>
      <p class="context-desc" id="ctxDesc"></p>
      <hr class="context-divider" />
      <div>
        <div class="context-label">Active variation</div>
        <div class="context-var-card" id="ctxVarCard"></div>
      </div>
      <hr class="context-divider" />
      <div>
        <div class="context-label">Try in this screen</div>
        <ul class="hint-list" id="ctxHints"></ul>
      </div>
      <div class="sample-notice">
        Demo prototype with sample student names, event counts, and GMetrix keys. All interactive state resets on page reload.
      </div>
    </aside>
  </main>

  <script src="./app.js"></script>
</body>
</html>
