# Dependabot Configuration
# Automatically creates PRs for npm dependency updates on a weekly schedule.
# Docs: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates

version: 2
updates:
  # NPM Dependencies (version updates targeting develop)
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Asia/Manila"
    open-pull-requests-limit: 10
    reviewers:
      - "AlexisRellon"
    labels:
      - "dependencies"
      - "automated"
    commit-message:
      prefix: "chore(deps)"
    groups:
      expo:
        patterns:
          - "expo"
          - "expo-*"
          - "@expo/*"
          - "jest-expo"
        update-types:
          - "minor"
          - "patch"
    # Pin core framework & tooling versions aligned with Expo SDK 58 compatibility
    ignore:
      - dependency-name: "react"
        update-types:
          - "version-update:semver-patch"
          - "version-update:semver-minor"
          - "version-update:semver-major"
      - dependency-name: "react-native"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
      - dependency-name: "jest"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"

  # NPM Security Updates (default branch main; limit 0 disables duplicate version updates)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    reviewers:
      - "AlexisRellon"
    labels:
      - "security"
      - "dependencies"
      - "automated"
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-security:
        applies-to: "security-updates"
        patterns:
          - "*"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "ci/cd"
      - "automated"
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions:
        patterns:
          - "*"
