# =============================================================================
# MyCCS — Mobile App + Standalone Web Admin Portal
# Multi-Tiered DevSecOps CI/CD Pipeline
# =============================================================================
# Triggers:
#   - pull_request (main, develop) -> CI only (Phases 1–3)
#   - push (main, develop)         -> Post-merge Build & CD (Phases 4–5)
# =============================================================================

name: CI/CD Pipeline

on:
  pull_request:
    branches:
      - main
      - develop
    types: [opened, synchronize, reopened, edited]
  push:
    branches:
      - main
      - develop

# Cancel in-flight runs for the same PR or branch
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

# =============================================================================
# PHASE 1 — JIRA TICKET VALIDATION (PR CI)
# =============================================================================
jobs:
  jira-check:
    name: "Phase 1 · Jira Ticket Validation"
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Validate SCRUM Jira key in PR title or branch
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          HEAD_REF: ${{ github.head_ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          if [ "$PR_AUTHOR" = "dependabot[bot]" ]; then
            echo "⏭️ Skipping SCRUM Jira key check for automated dependabot[bot] PR (passing required check)."
            exit 0
          fi
          if echo "$PR_TITLE $HEAD_REF" | grep -qE "SCRUM-[0-9]+"; then
            echo "✅ Valid SCRUM Jira key found."
          else
            echo "❌ PR title or branch name must include a valid SCRUM-<number> Jira key."
            exit 1
          fi

  # ===========================================================================
  # PHASE 2 — STATIC ANALYSIS
  # DevSecOps gate: SAST, SCA, and AI-powered code review
  # ===========================================================================
  # ---------------------------------------------------------------------------
  # CodeRabbit AI — Handled natively by the CodeRabbit GitHub App via .coderabbit.yaml
  # Required status check name: "CodeRabbit" (tracked in scripts/branch-protection-body.json)
  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # CodeQL — Static Application Security Testing (SAST)
  # ---------------------------------------------------------------------------
  codeql:
    name: "Phase 2 · CodeQL SAST"
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          # TODO: Add custom CodeQL query suites if needed
          # queries: +security-extended,security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"

  # ---------------------------------------------------------------------------
  # Snyk — Software Composition Analysis (SCA)
  # ---------------------------------------------------------------------------
  snyk:
    name: "Phase 2 · Snyk SCA"
    runs-on: ubuntu-latest
    env:
      HAS_SNYK_TOKEN: ${{ secrets.SNYK_TOKEN != '' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Web Admin dependencies
        run: npm --prefix web-admin ci

      # TODO: Add SNYK_TOKEN to repository secrets
      # Get your token from: https://app.snyk.io/account
      - name: Run Snyk on root mobile workspace
        if: env.HAS_SNYK_TOKEN == 'true'
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

      - name: Run Snyk on standalone web-admin workspace
        if: env.HAS_SNYK_TOKEN == 'true'
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --file=web-admin/package.json --severity-threshold=high

      - name: Warn when SNYK_TOKEN is not configured
        if: env.HAS_SNYK_TOKEN != 'true'
        run: |
          echo "::warning::SNYK_TOKEN is not configured in repository secrets — skipping Snyk SCA scan. Add SNYK_TOKEN (https://app.snyk.io/account) to fail PRs on high/critical vulnerabilities."

  # =============================================================================
  # PHASE 3 — AUTOMATED QA
  # Unit tests, API tests, and E2E tests
  # =============================================================================

  # ---------------------------------------------------------------------------
  # Jest — Unit & Component Testing
  # ---------------------------------------------------------------------------
  jest:
    name: "Phase 3 · Jest Unit Tests"
    runs-on: ubuntu-latest
    needs: [codeql, snyk]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript typecheck
        run: npx tsc --noEmit

      - name: Run Jest tests
        run: npm test -- --coverage --ci --reporters=default --reporters=jest-junit
        env:
          JEST_JUNIT_OUTPUT_DIR: ./reports/junit

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jest-results
          path: ./reports/junit/
          retention-days: 30

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: ./coverage/
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Newman — Supabase Edge Function API Testing
  # ---------------------------------------------------------------------------
  newman:
    name: "Phase 3 · Newman API Tests"
    runs-on: ubuntu-latest
    needs: [codeql, snyk]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Newman
        run: npm install -g newman newman-reporter-htmlextra

      # TODO: Create Postman collection exports in /tests/api/
      # Export collections from Postman and place them at:
      #   tests/api/collection.json
      #   tests/api/environment.json
      - name: Run Newman API tests
        run: |
          echo "🔧 Newman API tests placeholder"
          echo "   To activate, create Postman collections at:"
          echo "   tests/api/collection.json"
          echo "   tests/api/environment.json"
          # newman run tests/api/collection.json \
          #   -e tests/api/environment.json \
          #   -r htmlextra,cli,junit \
          #   --reporter-htmlextra-export ./reports/newman/report.html \
          #   --reporter-junit-export ./reports/newman/junit.xml

      - name: Upload Newman results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: newman-results
          path: ./reports/newman/
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Playwright — E2E Web Admin Testing
  # ---------------------------------------------------------------------------
  playwright:
    name: "Phase 3 · Playwright E2E Tests"
    runs-on: ubuntu-latest
    needs: [codeql, snyk]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Web Admin dependencies
        run: npm --prefix web-admin ci

      - name: Typecheck and build Web Admin
        run: npm --prefix web-admin run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: ./playwright-report/
          retention-days: 30

  # =============================================================================
  # PHASE 4 — BUILD (Post-Merge to develop / main)
  # Expo EAS cloud build → .apk / .ipa → GitHub Artifact upload
  # =============================================================================
  build:
    name: "Phase 4 · Expo EAS Build"
    runs-on: ubuntu-latest
    needs: [jest, newman, playwright]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    strategy:
      matrix:
        platform: [android]
        # TODO: Add 'ios' when Apple Developer account is configured
        # platform: [android, ios]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Setup Expo & EAS CLI
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # TODO: Configure eas.json with build profiles
      # Run: eas build:configure
      # Profiles: development, preview, production
      - name: Run EAS Build (${{ matrix.platform }})
        run: |
          echo "🔧 EAS Build placeholder for ${{ matrix.platform }}"
          echo "   To activate:"
          echo "   1. Run: npx eas-cli build:configure"
          echo "   2. Add EXPO_TOKEN to repository secrets"
          echo "   3. Uncomment the eas build command below"
          # eas build \
          #   --platform ${{ matrix.platform }} \
          #   --profile preview \
          #   --non-interactive \
          #   --no-wait

      # TODO: Download and upload the built binary as a GitHub Artifact
      # After EAS build completes, the binary URL is available in the output
      - name: Upload build artifact
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: app-${{ matrix.platform }}-${{ github.sha }}
          path: |
            *.apk
            *.ipa
          retention-days: 90
          if-no-files-found: warn

  # =============================================================================
  # PHASE 5 — CONTINUOUS DEPLOYMENT (Post-Merge to main ONLY)
  # Standalone web-admin/ deploy + Supabase migrations & Edge Functions
  # =============================================================================
  deploy:
    name: "Phase 5 · Deploy"
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
      url: ${{ steps.deploy-web.outputs.url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: "Placeholder: Deploy Web Admin to Cloudflare Pages"
        id: deploy-web
        run: |
          echo "🔧 Cloudflare Pages Web Admin deployment placeholder"
          echo "   Configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets to run wrangler pages deploy web-admin/dist"
          echo "url=https://myccs-web-admin.pages.dev" >> $GITHUB_OUTPUT

      # ----- Supabase Database Migrations -----
      # TODO: Add SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD,
      #       SUPABASE_PROJECT_ID to repository secrets
      - name: "Placeholder: Supabase Migrations"
        run: |
          echo "🔧 Supabase migration placeholder"
          echo "   To activate:"
          echo "   1. Add SUPABASE_ACCESS_TOKEN to secrets"
          echo "   2. Add SUPABASE_PROJECT_ID to secrets"
          echo "   3. Uncomment the migration commands below"
          # npx supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
          # npx supabase db push
