name: Chore / Technical Task
description: Track DevOps, CI/CD, security hardening, refactoring, documentation, or technical debt work
title: "[SCRUM-XXX] chore(<scope>): "
labels: ["chore"]
body:
  - type: markdown
    attributes:
      value: |
        Use this template for maintenance, CI/CD, DevSecOps, documentation, or refactoring tasks.

  - type: input
    id: jira-key
    attributes:
      label: Jira Ticket
      description: Linked `SCRUM-*` Jira ticket key (required for branch and PR validation).
      placeholder: "SCRUM-9"
    validations:
      required: false

  - type: dropdown
    id: category
    attributes:
      label: Task Type
      options:
        - CI/CD & GitHub Actions
        - Security / DevSecOps (CodeQL, Snyk, RLS, Auth)
        - Refactoring / Tech Debt
        - Documentation / OpenSpec / Graphify
        - Dependencies / Tooling
    validations:
      required: true

  - type: textarea
    id: goal
    attributes:
      label: Goal & Context
      description: What needs to change and why?
    validations:
      required: true

  - type: textarea
    id: checklist
    attributes:
      label: Definition of Done
      value: |
        - [ ] Implementation complete on `<type>/SCRUM-<N>-<kebab-slug>` branch
        - [ ] Local checks pass (`npx tsc --noEmit` & `npm test -- --ci`)
        - [ ] Related docs / rules / Graphify updated if applicable
        - [ ] PR targets `develop` (Squash and Merge) with CI Phases 1–3 green
    validations:
      required: true
